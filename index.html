<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080c10;--surface:#0e1318;--surface2:#141b22;
  --border:rgba(255,255,255,0.07);--text:#e8edf2;
  --muted:rgba(232,237,242,0.4);--dim:rgba(232,237,242,0.2);
  --green:#00e5a0;--red:#ff4d6d;--blue:#4db8ff;--gold:#f5c842;--purple:#a78bfa;
}
body{background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,229,160,0.025) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,160,0.025) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0}
.app{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:20px 16px 60px}
.header{padding:24px 0 20px;border-bottom:1px solid var(--border);margin-bottom:24px}
.header-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.logo{font-size:11px;font-family:'DM Mono',monospace;letter-spacing:3px;color:var(--green)}
.last-updated{font-size:10px;font-family:'DM Mono',monospace;color:var(--dim)}
.net-worth{font-size:38px;font-weight:800;letter-spacing:-1.5px;line-height:1;margin-bottom:6px}
.net-worth .amount{color:var(--green)}
.net-worth-sub{font-size:12px;color:var(--muted);font-family:'DM Mono',monospace}
.refresh-btn{display:flex;align-items:center;gap:6px;background:rgba(0,229,160,0.08);border:1px solid rgba(0,229,160,0.2);color:var(--green);font-family:'DM Mono',monospace;font-size:11px;letter-spacing:1px;padding:8px 16px;border-radius:8px;cursor:pointer;transition:all .2s;margin-top:16px}
.refresh-btn:hover{background:rgba(0,229,160,0.16)}
.refresh-btn:disabled{opacity:0.4;cursor:not-allowed}
@keyframes spin{to{transform:rotate(360deg)}}
.spinning{display:inline-block;animation:spin .8s linear infinite}
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px}
.card-label{font-size:10px;font-family:'DM Mono',monospace;letter-spacing:1.5px;color:var(--dim);margin-bottom:6px}
.card-value{font-size:20px;font-weight:700;letter-spacing:-0.5px}
.card-sub{font-size:11px;color:var(--muted);margin-top:3px;font-family:'DM Mono',monospace}
.green{color:var(--green)}.blue{color:var(--blue)}.gold{color:var(--gold)}.red{color:var(--red)}
.section{margin-bottom:20px}
.section-title{font-size:10px;font-family:'DM Mono',monospace;letter-spacing:3px;color:var(--dim);margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.holding{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:10px;position:relative;overflow:hidden;transition:border-color .2s}
.holding:hover{border-color:rgba(0,229,160,0.15)}
.holding-accent{position:absolute;left:0;top:0;bottom:0;width:3px}
.holding-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.holding-name{font-size:20px;font-weight:800;letter-spacing:-0.5px}
.holding-desc{font-size:11px;color:var(--muted);margin-top:2px}
.holding-right{text-align:right}
.holding-mktval{font-size:18px;font-weight:700}
.holding-pl{font-size:12px;font-family:'DM Mono',monospace;margin-top:3px}
.holding-details{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.detail{background:var(--surface2);border-radius:8px;padding:9px 10px}
.detail-label{font-size:9px;font-family:'DM Mono',monospace;color:var(--dim);letter-spacing:1px;margin-bottom:4px}
.detail-value{font-size:13px;font-weight:600}
.alloc-bar{height:3px;background:var(--surface2);border-radius:2px;margin-top:12px;overflow:hidden}
.alloc-fill{height:100%;border-radius:2px;transition:width .8s ease}
.alloc-label{font-size:10px;font-family:'DM Mono',monospace;color:var(--dim);margin-top:5px}
.room-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-top:10px}
.room-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.room-title{font-size:13px;font-weight:600}
.room-value{font-size:13px;font-family:'DM Mono',monospace;color:var(--green)}
.room-track{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.room-fill{height:100%;background:linear-gradient(90deg,var(--green),#00b37a);border-radius:3px;transition:width .8s ease}
.room-sub{font-size:10px;font-family:'DM Mono',monospace;color:var(--dim);margin-top:7px}
.dca-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:10px}
.dca-row{display:flex;gap:8px;margin-top:12px}
.dca-item{flex:1;border-radius:8px;padding:10px;text-align:center}
.dca-ticker{font-size:10px;font-family:'DM Mono',monospace;color:var(--dim);margin-bottom:4px;letter-spacing:1px}
.dca-amount{font-size:18px;font-weight:700}
.status-box{text-align:center;padding:48px 20px}
.status-icon{font-size:32px;margin-bottom:12px}
.status-text{font-family:'DM Mono',monospace;font-size:12px;color:var(--muted);line-height:1.6}
.error-box{background:rgba(255,77,109,0.08);border:1px solid rgba(255,77,109,0.2);border-radius:12px;padding:16px;font-family:'DM Mono',monospace;font-size:11px;color:var(--red);line-height:1.8;margin-top:12px}
.debug-box{background:var(--surface2);border-radius:8px;padding:12px;margin-top:12px;font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);overflow:auto;max-height:300px;white-space:pre-wrap;word-break:break-all}
.debug-toggle{font-size:10px;font-family:'DM Mono',monospace;color:var(--dim);cursor:pointer;text-decoration:underline;margin-top:8px;display:inline-block}
.fade-in{animation:fadeIn .4s ease forwards}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.footer{font-size:10px;font-family:'DM Mono',monospace;color:var(--dim);text-align:center;padding:16px 0;border-top:1px solid var(--border);margin-top:8px;line-height:1.8}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-top">
      <div class="logo">◈ PORTFOLIO</div>
      <div class="last-updated" id="lastUpdated">not loaded</div>
    </div>
    <div class="net-worth" id="netWorth"><span class="amount">$—</span></div>
    <div class="net-worth-sub" id="netWorthSub">tap refresh to load live data</div>
    <button class="refresh-btn" id="refreshBtn" onclick="loadPortfolio()">
      <span id="refreshIcon">↻</span> REFRESH
    </button>
  </div>
  <div id="content">
    <div class="status-box">
      <div class="status-icon">📊</div>
      <div class="status-text">Hit REFRESH to load your<br/>live portfolio from Google Sheets</div>
    </div>
  </div>
</div>
<script>
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQjFX8CzTqunVVDo7-pygheI9GU-gKdvBvcqaxdd3J-fd3ytTvtFEMvCgVND29cyAJv6b0yWK6gHS5h/pub?output=csv&t=' + Date.now();

const TFSA_ROOM_2026 = 28700.12;
const TFSA_CONTRIB_2026 = 4553.26;
const DEFAULT_FX = 1.3674;

const META = {
  'VFV':   { color: '#00e5a0', desc: 'S&P 500 Index ETF',        account: 'TFSA', currency: 'CAD' },
  'QQC':   { color: '#4db8ff', desc: 'NASDAQ 100 ETF (unhedged)', account: 'TFSA', currency: 'CAD' },
  'QQC.F': { color: '#a78bfa', desc: 'NASDAQ 100 ETF (hedged)',   account: 'TFSA', currency: 'CAD' },
  'VOO':   { color: '#f5c842', desc: 'S&P 500 Index ETF (USD)',   account: 'RRSP', currency: 'USD' },
};

function fmt(v, decimals=0) {
  if (isNaN(v)) return '$—';
  return '$' + Number(v).toLocaleString('en-CA', {minimumFractionDigits:decimals,maximumFractionDigits:decimals});
}

function setLoading(on) {
  const btn = document.getElementById('refreshBtn');
  const icon = document.getElementById('refreshIcon');
  btn.disabled = on;
  icon.className = on ? 'spinning' : '';
  icon.textContent = '↻';
}

function parseCSV(text) {
  return text.trim().split('\n').map(line => {
    const cells = [];
    let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') { inQ = !inQ; }
      else if (ch === ',' && !inQ) { cells.push(cur.trim()); cur = ''; }
      else { cur += ch; }
    }
    cells.push(cur.trim());
    return cells;
  });
}

function toNum(s) {
  if (!s) return null;
  const n = parseFloat(String(s).replace(/[$,%\s]/g, ''));
  return isNaN(n) ? null : n;
}

async function loadPortfolio() {
  setLoading(true);
  document.getElementById('lastUpdated').textContent = 'loading...';
  try {
    const url = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQjFX8CzTqunVVDo7-pygheI9GU-gKdvBvcqaxdd3J-fd3ytTvtFEMvCgVND29cyAJv6b0yWK6gHS5h/pub?output=csv&t=' + Date.now();
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    const rows = parseCSV(text);
    processAndRender(rows, text);
    document.getElementById('lastUpdated').textContent = 'Updated ' + new Date().toLocaleTimeString();
  } catch(err) {
    document.getElementById('netWorthSub').textContent = 'error loading data';
    document.getElementById('content').innerHTML = `
      <div class="error-box">
        ⚠ ${err.message}<br/><br/>
        Make sure your sheet is published:<br/>
        File → Share → Publish to web → CSV
      </div>`;
  }
  setLoading(false);
}

function processAndRender(rows, rawText) {
  const holdings = [];
  let fxRate = DEFAULT_FX;

  // Pull weekly DCA amounts from sheet
  // Q2 = row index 1, col index 16 (VFV weekly)
  // Q3 = row index 2, col index 16 (QQC weekly)
  // N2 = row index 1, col index 13 (total market value CAD)
  let vfvWeekly = 125, qqcWeekly = 50;
  let sheetTotalCAD = null;
  try {
    if (rows[1] && rows[1][16]) { const v = toNum(rows[1][16]); if (v && v > 0) vfvWeekly = v; }
    if (rows[2] && rows[2][16]) { const v = toNum(rows[2][16]); if (v && v > 0) qqcWeekly = v; }
    if (rows[1] && rows[1][13]) { const v = toNum(rows[1][13]); if (v && v > 0) sheetTotalCAD = v; }
  } catch(e) {}
  window._vfvWeekly = vfvWeekly;
  window._qqcWeekly = qqcWeekly;
  window._sheetTotalCAD = sheetTotalCAD;

  rows.forEach(row => {
    row.forEach((cell, ci) => {
      const ticker = String(cell).trim().toUpperCase();
      if (META[ticker]) {
        // collect all numeric values in this row
        const nums = row.map(c => toNum(c)).filter(n => n !== null && n > 0);
        const afterNums = row.slice(ci+1).map(c => toNum(c)).filter(n => n !== null);

        // Try to get shares (first significant number after ticker)
        // shares will be small-ish (1-1000), avg cost medium, price medium
        let shares=null, avgCost=null, currentPrice=null, bookCost=null, mktValue=null, pl=null;

        // Filter numbers after ticker
        const positiveAfter = row.slice(ci+1).map((c,i) => ({val: toNum(c), i})).filter(x => x.val !== null && x.val > 0);

        if (positiveAfter.length >= 1) shares = positiveAfter[0].val;
        if (positiveAfter.length >= 2) avgCost = positiveAfter[1].val;
        if (positiveAfter.length >= 3) currentPrice = positiveAfter[2].val;
        if (positiveAfter.length >= 4) bookCost = positiveAfter[3].val;
        if (positiveAfter.length >= 5) mktValue = positiveAfter[4].val;
        if (positiveAfter.length >= 6) pl = positiveAfter[5].val;

        // Sanity check — shares should be < 10000, prices should be reasonable
        if (shares && shares > 0 && shares < 10000) {
          holdings.push({
            ticker,
            shares,
            avgCost,
            currentPrice,
            bookCost: bookCost || (shares * avgCost),
            marketValue: mktValue || (shares * (currentPrice||avgCost)),
            pl,
            ...META[ticker]
          });
        }
      }

      // Detect FX rate — look for number between 1.2 and 1.6 near USD text
      if (String(cell).toUpperCase().includes('USD') && toNum(row[ci+1]) > 1.2 && toNum(row[ci+1]) < 1.6) {
        fxRate = toNum(row[ci+1]);
      }
    });
  });

  // Deduplicate — keep last occurrence of each ticker (most complete row)
  const seen = {};
  holdings.forEach(h => { seen[h.ticker] = h; });
  const unique = Object.values(seen);

  if (unique.length === 0) {
    // Show raw CSV for debugging
    document.getElementById('netWorthSub').textContent = 'sheet connected — parsing issue';
    document.getElementById('content').innerHTML = `
      <div class="error-box">✓ Sheet connected successfully<br/>⚠ Could not find holdings — share raw data below with your financial guru</div>
      <span class="debug-toggle" onclick="document.getElementById('dbg').style.display='block';this.style.display='none'">Show raw CSV ↓</span>
      <div class="debug-box" id="dbg" style="display:none">${rawText.substring(0,3000)}</div>`;
    return;
  }

  renderPortfolio(unique, fxRate);
}

function renderPortfolio(holdings, fxRate) {
  // Calculate totals
  const enriched = holdings.map(h => {
    const mkt = h.marketValue || (h.shares * (h.currentPrice||h.avgCost)) || 0;
    const book = h.bookCost || (h.shares * h.avgCost) || 0;
    const pl = h.pl != null ? h.pl : (mkt - book);
    const plPct = book > 0 ? (pl/book)*100 : 0;
    const mktCAD = h.currency === 'USD' ? mkt * fxRate : mkt;
    const bookCAD = h.currency === 'USD' ? book * fxRate : book;
    return {...h, mkt, book, pl, plPct, mktCAD, bookCAD};
  });

  const totalMktCAD = enriched.reduce((s,h) => s+h.mktCAD, 0);
  const totalBookCAD = enriched.reduce((s,h) => s+h.bookCAD, 0);
  const totalPL = totalMktCAD - totalBookCAD;
  const totalPLPct = totalBookCAD > 0 ? (totalPL/totalBookCAD)*100 : 0;
  const plSign = totalPL >= 0 ? '+' : '';

  const displayTotal = (window._sheetTotalCAD && window._sheetTotalCAD > 0) ? window._sheetTotalCAD : totalMktCAD;
  const displayPL = displayTotal - totalBookCAD;
  const displayPLPct = totalBookCAD > 0 ? (displayPL/totalBookCAD)*100 : 0;
  const displaySign = displayPL >= 0 ? '+' : '';
  document.getElementById('netWorth').innerHTML = `<span class="amount">${fmt(displayTotal)}</span> <span style="font-size:16px;color:var(--muted);font-weight:400">CAD</span>`;
  document.getElementById('netWorthSub').innerHTML = `<span style="color:var(--green)">${displaySign}${fmt(displayPL)} (${displaySign}${displayPLPct.toFixed(2)}%)</span> total return`;

  const tfsaH = enriched.filter(h => h.account==='TFSA');
  const rrspH = enriched.filter(h => h.account==='RRSP');
  const tfsaTotal = tfsaH.reduce((s,h) => s+h.mktCAD, 0);
  const rrspTotal = rrspH.reduce((s,h) => s+h.mktCAD, 0);
  const tfsaRoomLeft = TFSA_ROOM_2026 - TFSA_CONTRIB_2026;
  const tfsaRoomPct = (TFSA_CONTRIB_2026/TFSA_ROOM_2026)*100;

  let html = `<div class="fade-in">`;

  // Summary cards
  html += `<div class="summary-grid">
    <div class="card"><div class="card-label">TOTAL P/L</div><div class="card-value green">${plSign}${fmt(totalPL)}</div><div class="card-sub">${plSign}${totalPLPct.toFixed(2)}% all time</div></div>
    <div class="card"><div class="card-label">INVESTED</div><div class="card-value">${fmt(totalBookCAD)}</div><div class="card-sub">book cost CAD</div></div>
    <div class="card"><div class="card-label">TFSA</div><div class="card-value blue">${fmt(tfsaTotal)}</div><div class="card-sub">CAD</div></div>
    <div class="card"><div class="card-label">RRSP</div><div class="card-value gold">${fmt(rrspTotal)}</div><div class="card-sub">≈ ${fmt(rrspH.reduce((s,h)=>s+h.mkt,0))} USD</div></div>
  </div>`;

  // TFSA
  if (tfsaH.length > 0) {
    html += `<div class="section"><div class="section-title">TFSA · TAX-FREE SAVINGS</div>`;
    tfsaH.forEach(h => { html += holdingCard(h, tfsaTotal, false); });
    }

  // RRSP
  if (rrspH.length > 0) {
    html += `<div class="section"><div class="section-title">RRSP · RETIREMENT SAVINGS</div>`;
    rrspH.forEach(h => { html += holdingCard(h, rrspTotal, true); });
    html += `</div>`;
  }

  // DCA
  html += `<div class="section"><div class="section-title">WEEKLY DCA</div>
    <div class="dca-card">
      <div style="display:flex;justify-content:space-between">
        <div><div class="card-label">PER WEEK</div><div class="card-value green">$${(window._vfvWeekly||125)+(window._qqcWeekly||50)} CAD</div></div>
        <div style="text-align:right"><div class="card-label">PER YEAR</div><div class="card-value">$${((window._vfvWeekly||125)+(window._qqcWeekly||50))*52}</div></div>
      </div>
      <div class="dca-row">
        <div class="dca-item" style="background:rgba(0,229,160,0.07);border:1px solid rgba(0,229,160,0.15)"><div class="dca-ticker">VFV</div><div class="dca-amount green">$${window._vfvWeekly||125}</div></div>
        <div class="dca-item" style="background:rgba(77,184,255,0.07);border:1px solid rgba(77,184,255,0.15)"><div class="dca-ticker">QQC</div><div class="dca-amount blue">$${window._qqcWeekly||50}</div></div>
      </div>
    </div>
  </div>`;

  html += `<div class="footer">Live from Google Sheets · USD/CAD ${fxRate} · RRSP room $20,537 · FHSA room $16,000</div></div>`;
  document.getElementById('content').innerHTML = html;
}

function holdingCard(h, sectionTotal, isUSD) {
  const displayVal = isUSD ? h.mkt : h.mktCAD;
  const displayPL = isUSD ? h.pl : (h.mktCAD - h.bookCAD);
  const plPct = h.bookCAD > 0 ? (displayPL / (isUSD ? h.book : h.bookCAD))*100 : h.plPct;
  const plSign = displayPL >= 0 ? '+' : '';
  const plClass = displayPL >= 0 ? 'green' : 'red';
  const allocPct = sectionTotal > 0 ? (h.mktCAD/sectionTotal*100) : 0;
  const currLabel = isUSD ? ' USD' : '';

  return `<div class="holding">
    <div class="holding-accent" style="background:${h.color}"></div>
    <div class="holding-top">
      <div><div class="holding-name">${h.ticker}</div><div class="holding-desc">${h.desc}</div></div>
      <div class="holding-right">
        <div class="holding-mktval">${fmt(displayVal)}${currLabel}</div>
        <div class="holding-pl ${plClass}">${plSign}${fmt(Math.abs(displayPL))} (${plSign}${Math.abs(plPct).toFixed(2)}%)</div>
      </div>
    </div>
    <div class="holding-details">
      <div class="detail"><div class="detail-label">SHARES</div><div class="detail-value">${Number(h.shares).toFixed(4)}</div></div>
      <div class="detail"><div class="detail-label">AVG COST</div><div class="detail-value">${fmt(h.avgCost,2)}</div></div>
      <div class="detail"><div class="detail-label">PRICE</div><div class="detail-value" style="color:${h.color}">${fmt(h.currentPrice,2)}</div></div>
    </div>
    <div class="alloc-bar"><div class="alloc-fill" style="width:${allocPct.toFixed(1)}%;background:${h.color}"></div></div>
    <div class="alloc-label">${allocPct.toFixed(1)}% of ${h.account}</div>
  </div>`;
}

loadPortfolio();
</script>
</body>
</html>
